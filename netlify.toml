[build]
  command = "GOOS=js GOARCH=wasm go build -tags 'release no_emoji migrated_fynedo' -ldflags='-s -w' -o web/games.wasm ."
  publish = "web"

[build.environment]
  GO_VERSION = "1.26"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"
[build]
  command = "GOOS=js GOARCH=wasm go build -tags='release' -o web/games.wasm . && npm install -g wabt && npx -p wabt wasm-strip web/games.wasm"
  publish = "web"

[build.environment]
  GO_VERSION = "1.26"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"